name: ANIMO-MASSQ03 TCD025 selected-profile control-volume qualification

on:
  push:
    branches:
      - work/animo-massq03-tcd025-selected-profile-control-volume
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact qualification and governance authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            624bbad35add93de29ac89649155d9fa086a73af \
            7a7309e913e8216a20ac134539470e3e5eb4302f \
            f65a47724e4a4fca7f2d8b8d6de9eeee51867904 \
            1bbe4c211197590f346803106e45dca5faae79fc \
            cbd262bdabe92923113b7326f2f42822ce9a971c \
            56a11b524d03c33ee4ab9b1cd13b2cd523d543fc \
            7b5979dd6301b9d55d23e8c22948a0dba24b229b \
            6b0f2e7470f13baeb6612b0bddb662a497dea528 \
            6c9ab83952b53566b878b533c08e3cb10074f399
          do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "${sha}"
            git cat-file -e "${sha}^{commit}"
          done

      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify consumed exact-final workflow identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          checks = {
              34568286088: "624bbad35add93de29ac89649155d9fa086a73af",
              34569670740: "7a7309e913e8216a20ac134539470e3e5eb4302f",
          }
          token = os.environ["GH_TOKEN"]
          for run_id, expected_sha in checks.items():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{run_id}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req) as r:
                  data = json.load(r)
              assert data["head_sha"] == expected_sha, (run_id, data["head_sha"], expected_sha)
              assert data["status"] == "completed" and data["conclusion"] == "success", (run_id, data["status"], data["conclusion"])
          print("exact-final aggregate and B3A08 workflows verified")
          PY

      - name: Parse persisted qualification records
        run: |
          python -m json.tool integration/animo-mass/MASSQ03_TCD025_CONTROL_VOLUME_CONTRACT.json >/dev/null
          python -m json.tool integration/animo-mass/MASSQ03_SOURCE_SEAM_EVIDENCE.json >/dev/null
          python -m json.tool integration/animo-mass/ANIMO-MASSQ03_STATUS.json >/dev/null
          python -m json.tool integration/animo-mass/ANIMO-MASSQ03_AUTHORING_FREEZE.json >/dev/null
          if test -f integration/animo-mass/ANIMO-MASSQ03_INTERNAL_ADVERSARIAL_REVIEW.json; then
            python -m json.tool integration/animo-mass/ANIMO-MASSQ03_INTERNAL_ADVERSARIAL_REVIEW.json >/dev/null
          fi
          python -m py_compile tools/massq03/validate_massq03.py

      - name: Validate control-volume qualification and exact scope
        run: python tools/massq03/validate_massq03.py
