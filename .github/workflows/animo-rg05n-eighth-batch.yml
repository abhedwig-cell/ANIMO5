name: ANIMO-RG05N eighth batched B3 admission integration
on:
  push:
    branches: [work/animo-rg05n-eighth-batched-admission-integration]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch exact authorities
        run: |
          set -euo pipefail
          for sha in 7146612d5dfa8ad87a4660f0c50c68a5db1e3a29 8bd1d0a5e20e5fa1d15508e0fdf7c69a5150a84f c6fe71cfd1822aea5d00a802862e4b3a4a991cd2 025bb9e5da84a6a1b55d29681de005fca784f543 942f26fe32eaf91679e59a1968ae173a3703e22d dcc0885f73de6241d5efa9324ddb9f41784f6f2d f65a47724e4a4fca7f2d8b8d6de9eeee51867904 1bbe4c211197590f346803106e45dca5faae79fc cbd262bdabe92923113b7326f2f42822ce9a971c; do git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"; done
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify consumed exact-final workflows
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          checks={34610132079:"7146612d5dfa8ad87a4660f0c50c68a5db1e3a29",34642563837:"8bd1d0a5e20e5fa1d15508e0fdf7c69a5150a84f",34644248709:"c6fe71cfd1822aea5d00a802862e4b3a4a991cd2",34646389629:"025bb9e5da84a6a1b55d29681de005fca784f543"}
          for n,h in checks.items():
            q=urllib.request.Request(f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{n}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
            with urllib.request.urlopen(q) as f:d=json.load(f)
            assert d["head_sha"]==h and d["status"]=="completed" and d["conclusion"]=="success",(n,d.get("head_sha"),d.get("status"),d.get("conclusion"))
          print("exact-final upstream workflows verified")
          PY
      - name: Parse records
        run: |
          python -m json.tool integration/animo-reg/RG05N_B3_ADMISSION_INVENTORY.json >/dev/null
          python -m json.tool integration/animo-reg/RG05N_B3_QUEUE_DELTA.json >/dev/null
          python -m json.tool integration/animo-reg/ANIMO-RG05N_STATUS.json >/dev/null
          python -m py_compile tools/validate_rg05n_eighth_batch.py
      - run: python tools/validate_rg05n_eighth_batch.py
