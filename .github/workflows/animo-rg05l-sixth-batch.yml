name: ANIMO-RG05L sixth batched B3 admission integration
on:
  push:
    branches: [work/animo-rg05l-sixth-batched-admission-integration]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch exact authorities
        run: |
          set -euo pipefail
          for sha in e5ccad78d7c85aaf2c68d844c5a496edf6d73db5 0bec1968adbf77fd04c6f46819d704b86482d8b2 4d7c42bb749ed5fbf1c884fba4a26a1a5b898505 942f26fe32eaf91679e59a1968ae173a3703e22d 8b2a4071d623bc2e3003dca8977e032d5c0d8c3c f65a47724e4a4fca7f2d8b8d6de9eeee51867904 1bbe4c211197590f346803106e45dca5faae79fc cbd262bdabe92923113b7326f2f42822ce9a971c; do git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"; done
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify consumed exact-final workflows
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          checks={34582143283:"e5ccad78d7c85aaf2c68d844c5a496edf6d73db5",34583130973:"0bec1968adbf77fd04c6f46819d704b86482d8b2",34586116849:"4d7c42bb749ed5fbf1c884fba4a26a1a5b898505",34587001516:"942f26fe32eaf91679e59a1968ae173a3703e22d",34588335817:"8b2a4071d623bc2e3003dca8977e032d5c0d8c3c"}
          for n,h in checks.items():
            q=urllib.request.Request(f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{n}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
            with urllib.request.urlopen(q) as f:d=json.load(f)
            assert d["head_sha"]==h and d["status"]=="completed" and d["conclusion"]=="success",(n,d.get("head_sha"),d.get("status"),d.get("conclusion"))
          print("exact-final upstream workflows verified")
          PY
      - name: Parse records
        run: |
          python -m json.tool integration/animo-reg/RG05L_B3_ADMISSION_INVENTORY.json >/dev/null
          python -m json.tool integration/animo-reg/RG05L_B3_QUEUE_DELTA.json >/dev/null
          python -m json.tool integration/animo-reg/ANIMO-RG05L_STATUS.json >/dev/null
          python -m py_compile tools/validate_rg05l_sixth_batch.py
      - run: python tools/validate_rg05l_sixth_batch.py
