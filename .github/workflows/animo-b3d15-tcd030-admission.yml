name: ANIMO-B3D15 TCD-030 Tier-B admission

on:
  push:
    branches:
      - work/animo-b3d15-tcd030-gov04-tier-b-admission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate TCD-030 disposition and admission
        run: python tools/validate_b3d15_tcd030_admission.py

      - name: Validate atomic workunit scope
        run: python tools/validate_b3d15_scope.py
