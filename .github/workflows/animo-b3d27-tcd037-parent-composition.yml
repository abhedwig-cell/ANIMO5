name: ANIMO-B3D27 TCD-037 parent composition exact-head qualification

on:
  push:
    branches:
      - work/animo-b3d27-tcd037-parent-composition-gov05-tier-d-admission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-parent-composition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify checkout identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Compile bounded validators
        run: |
          python -m py_compile tools/b3d27/tcd037_parent_composition_oracle.py
          python -m py_compile tools/validate_b3d27_tcd037_parent.py

      - name: Run parent composition oracle
        run: python tools/b3d27/tcd037_parent_composition_oracle.py

      - name: Run fail-closed B3D27 validator on exact head
        run: python tools/validate_b3d27_tcd037_parent.py --expected-head "${GITHUB_SHA}"
