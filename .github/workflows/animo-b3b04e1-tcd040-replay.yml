name: ANIMO-B3B04E1 TCD-040 replay evidence gate

on:
  push:
    branches:
      - work/animo-b3b04e1-tcd040-replay-evidence
    paths:
      - 'docs/b3/TCD040_EVIDENCE_REMEDIATION.md'
      - 'docs/b3/TCD040_REPLAY_INSTRUCTIONS.md'
      - 'integration/animo-b3/ANIMO-B3B04E1_STATUS.json'
      - 'integration/animo-b3/b3b04e1/**'
      - 'tools/b3b04e1/**'
      - '.github/workflows/animo-b3b04e1-tcd040-replay.yml'
  pull_request:
    paths:
      - 'docs/b3/TCD040_EVIDENCE_REMEDIATION.md'
      - 'docs/b3/TCD040_REPLAY_INSTRUCTIONS.md'
      - 'integration/animo-b3/ANIMO-B3B04E1_STATUS.json'
      - 'integration/animo-b3/b3b04e1/**'
      - 'tools/b3b04e1/**'
      - '.github/workflows/animo-b3b04e1-tcd040-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-blocker-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse remediation metadata
        run: |
          python -m json.tool integration/animo-b3/ANIMO-B3B04E1_STATUS.json >/dev/null
          python -m json.tool integration/animo-b3/b3b04e1/TCD040_REPLAY_EXPECTATIONS.json >/dev/null
      - name: Audit expected fail-closed state and scope guard
        run: |
          python tools/b3b04e1/validate_b3b04e1.py \
            --audit-blocked-state \
            --require-git-scope
      - name: Prove qualification gate remains closed without controlled B0 and replay payloads
        run: |
          set +e
          python tools/b3b04e1/validate_b3b04e1.py --require-git-scope
          rc=$?
          set -e
          test "$rc" -ne 0
