name: ANIMO-B3D03 TCD-024 formal disposition

on:
  push:
    branches:
      - work/animo-b3d03-tcd024-gov03-disposition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-b3d03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate TCD-024 formal disposition
        run: python tools/validate_b3d03_tcd024_disposition.py

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              "integration/animo-b3/TCD024_B3_DISPOSITION_GOV03.json",
              "integration/animo-b3/ANIMO-B3D03_STATUS.json",
              "docs/b3/TCD024_GOV03_FORMAL_DISPOSITION.md",
              "tools/validate_b3d03_tcd024_disposition.py",
              ".github/workflows/animo-b3d03-tcd024-disposition.yml",
          }
          base = "a4eb1bb1632a573c93b7d44186f7d200a862c6e7"
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"],
              text=True,
          ).splitlines())
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit("FAIL_B3D03_SCOPE_GUARD unexpected files: " + ", ".join(sorted(unexpected)))
          if missing:
              raise SystemExit("FAIL_B3D03_SCOPE_GUARD missing files: " + ", ".join(sorted(missing)))
          print("PASS_B3D03_SCOPE_GUARD")
          PY
