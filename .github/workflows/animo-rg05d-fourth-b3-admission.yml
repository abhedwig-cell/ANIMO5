name: ANIMO-RG05D fourth B3 admission integration

on:
  push:
    branches:
      - work/animo-rg05d-fourth-b3-admission-integration

jobs:
  validate-rg05d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate fourth B3 admission integration
        run: python tools/validate_rg05d_fourth_b3_admission.py
      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          base=cc280b630d6dc0d6bc1b8b0783ccfa4f91e15624
          allowed='^(docs/governance/ANIMO_RG05D_FOURTH_B3_ADMISSION_REGIE.md|integration/animo-reg/RG05D_B3_ADMISSION_INVENTORY.json|integration/animo-reg/RG05D_B3_QUEUE_DELTA.json|integration/animo-reg/ANIMO-RG05D_STATUS.json|tools/validate_rg05d_fourth_b3_admission.py|\.github/workflows/animo-rg05d-fourth-b3-admission.yml)$'
          git diff --name-only "$base" HEAD | tee /tmp/changed.txt
          bad=$(grep -Ev "$allowed" /tmp/changed.txt || true)
          if [ -n "$bad" ]; then
            echo "Unexpected changed paths:"
            echo "$bad"
            exit 1
          fi
          test "$(wc -l < /tmp/changed.txt)" -eq 6
          echo PASS_RG05D_SCOPE_GUARD
