name: ANIMO-GHG03 TCD032 methanogenesis C-transfer ownership qualification

on:
  push:
    branches:
      - work/animo-ghg03-tcd032-methanogenesis-c-transfer-ownership

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in 83fedc7323cea6da696a81bc64e4e3b13d794880 dac7b7b5c591b781b82ec968896edb5957664c88 383c7a83e84a578969f92113280dc715b7bdddb4 997d867a2b107ec8e28efce530c82a204719de46 8758bd30e302b75dd7854ac00fd2e29473669a13 cbd262bdabe92923113b7326f2f42822ce9a971c f65a47724e4a4fca7f2d8b8d6de9eeee51867904; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify exact-final upstream authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          checks = {
              34655310361: "83fedc7323cea6da696a81bc64e4e3b13d794880",
              34654186685: "997d867a2b107ec8e28efce530c82a204719de46",
              34646787915: "8758bd30e302b75dd7854ac00fd2e29473669a13",
          }
          for run_id, head in checks.items():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{run_id}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
              assert data["head_sha"] == head, (run_id, data.get("head_sha"))
              assert data["status"] == "completed" and data["conclusion"] == "success", (run_id, data.get("status"), data.get("conclusion"))
          print("exact-final B3D40, B3Q05 and RG05N authorities verified")
          PY
      - name: Parse and compile GHG03 package
        run: |
          python -m json.tool integration/animo-ghg/GHG03_TCD032_C_TRANSFER_POLICY.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG03_AUTHORING_FREEZE.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG03_STATUS.json >/dev/null
          if test -f integration/animo-ghg/ANIMO-GHG03_INTERNAL_ADVERSARIAL_REVIEW.json; then
            python -m json.tool integration/animo-ghg/ANIMO-GHG03_INTERNAL_ADVERSARIAL_REVIEW.json >/dev/null
          fi
          python -m py_compile tools/ghg03/tcd032_c_transfer_oracle.py tools/ghg03/validate_ghg03_tcd032.py
      - name: Run exact rational carbon-transfer oracle
        run: python tools/ghg03/tcd032_c_transfer_oracle.py
      - name: Validate bounded TCD032 qualification
        run: python tools/ghg03/validate_ghg03_tcd032.py
