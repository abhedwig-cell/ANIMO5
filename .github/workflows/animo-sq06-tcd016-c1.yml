name: ANIMO-SQ06 TCD016-C1 dry-hold scientific qualification

on:
  push:
    branches:
      - work/animo-sq06-tcd016-c1-dry-hold-process-contract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact branch head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Fetch exact authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            bc9e6ed997a078336645210ebb4d99ae976893fe \
            11e9bcdc6654e63f84875bf1f28dc54abe725700 \
            f65a47724e4a4fca7f2d8b8d6de9eeee51867904 \
            1bbe4c211197590f346803106e45dca5faae79fc \
            cbd262bdabe92923113b7326f2f42822ce9a971c \
            846e0f4d02a38b9e02cc1419b1ca87e63aaedb54 \
            26d0c74aa440bd73c23709d313e24ea8af2a0bcd \
            09ab76f0b44cb72956875fa379d68bbf97f1a0c7 \
            58dc3c5c108ee97fd6bea107b7a9e686596617b1 \
            063627cddd478904c437c9c47f02513ef0d9326b \
            897ba742630f06381a2b89290db80d5f405ab51d \
            3e0f8254d9cd7966a4491b3068d0239b8ccda5f9; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
      - name: Parse SQ06 artifacts and compile tools
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool integration/animo-science/SQ06_TCD016_C1_DRY_HOLD_PROCESS_QUALIFICATION.json >/dev/null
          python -m json.tool integration/animo-science/ANIMO-SQ06_AUTHORING_FREEZE.json >/dev/null
          python -m json.tool integration/animo-science/ANIMO-SQ06_STATUS.json >/dev/null
          python -m json.tool integration/animo-testbank/fragments/ANIMO-SQ06_TCD016_C1_DRY_HOLD_NEGATIVE_FRAGMENT.json >/dev/null
          if test -f integration/animo-science/ANIMO-SQ06_INTERNAL_ADVERSARIAL_REVIEW.json; then
            python -m json.tool integration/animo-science/ANIMO-SQ06_INTERNAL_ADVERSARIAL_REVIEW.json >/dev/null
          fi
          python -m py_compile tools/sq06/tcd016_c1_dry_hold_negative_oracle.py tools/sq06/validate_sq06_tcd016_c1.py
      - name: Validate scientific package and exact synthetic guards
        run: python tools/sq06/validate_sq06_tcd016_c1.py
      - name: Guard bounded write scope and hard boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE=3e0f8254d9cd7966a4491b3068d0239b8ccda5f9
          git diff --name-only "$BASE" HEAD > /tmp/sq06_changed.txt
          while IFS= read -r path; do
            case "$path" in
              docs/science/TCD016_C1_DRY_HOLD_PROCESS_QUALIFICATION.md|\
              integration/animo-science/SQ06_TCD016_C1_DRY_HOLD_PROCESS_QUALIFICATION.json|\
              integration/animo-science/ANIMO-SQ06_AUTHORING_FREEZE.json|\
              integration/animo-science/ANIMO-SQ06_INTERNAL_ADVERSARIAL_REVIEW.json|\
              integration/animo-science/ANIMO-SQ06_STATUS.json|\
              integration/animo-testbank/fragments/ANIMO-SQ06_TCD016_C1_DRY_HOLD_NEGATIVE_FRAGMENT.json|\
              tools/sq06/tcd016_c1_dry_hold_negative_oracle.py|\
              tools/sq06/validate_sq06_tcd016_c1.py|\
              .github/workflows/animo-sq06-tcd016-c1.yml) ;;
              *) echo "Out-of-scope SQ06 path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/sq06_changed.txt
          if grep -E '^(src/|source/|Source/|animo/|ANIMO/)' /tmp/sq06_changed.txt; then
            echo 'Production source changed in SQ06' >&2
            exit 1
          fi
          if grep -Fx 'docs/quality/THEORY_CODE_DISCREPANCY_REGISTER.csv' /tmp/sq06_changed.txt; then
            echo 'Canonical discrepancy register changed in SQ06' >&2
            exit 1
          fi
          if grep -Fx 'integration/animo-testbank/ANIMO_TESTBANK_REGISTRY.json' /tmp/sq06_changed.txt; then
            echo 'Central testbank registry changed in SQ06' >&2
            exit 1
          fi
      - name: Exact-head identity
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "ANIMO-SQ06 exact head ${GITHUB_SHA}"
