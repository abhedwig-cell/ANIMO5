name: STATEQ01 P-state roundtrip qualification

on:
  push:
    branches:
      - work/animo-stateq01-canonical-state-readiness
    paths:
      - tools/stateq01/p_state_roundtrip_harness.py
      - tests/stateq01/test_p_state_roundtrip_harness.py
      - docs/state/P_STATE_ROUNDTRIP_QUALIFICATION.md
      - integration/animo-state/P_STATE_ROUNDTRIP_SENTINEL_STATUS.json
      - .github/workflows/stateq01-p-state-roundtrip.yml
  workflow_dispatch:

jobs:
  p-state-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run RC-R4 site-resolved P-state sentinels
        run: python -m unittest tests/stateq01/test_p_state_roundtrip_harness.py -v
