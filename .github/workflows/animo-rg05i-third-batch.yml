name: ANIMO-RG05I third batched atomic admission integration

on:
  push:
    branches:
      - work/animo-rg05i-third-batched-admission-integration
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact aggregate admission and governance authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            3e4247928bb43f30def951fa8804560636affbef \
            331f6ed91d4a1c15a23ae0c1ad75d1b540f61858 \
            0f85d7102945c7c4d77bc49885f9ecca688209e3 \
            6c9ab83952b53566b878b533c08e3cb10074f399 \
            54679c7555a963133dfd686648af334f479c5808 \
            31d4ac628edf43501b403f0844dd472bcc12644c \
            f65a47724e4a4fca7f2d8b8d6de9eeee51867904 \
            1bbe4c211197590f346803106e45dca5faae79fc \
            cbd262bdabe92923113b7326f2f42822ce9a971c
          do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "${sha}"
            git cat-file -e "${sha}^{commit}"
          done

      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify consumed exact-final workflow identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          checks = {
              34540047043: "331f6ed91d4a1c15a23ae0c1ad75d1b540f61858",
              34547891772: "0f85d7102945c7c4d77bc49885f9ecca688209e3",
              34548360916: "6c9ab83952b53566b878b533c08e3cb10074f399",
              34548605202: "31d4ac628edf43501b403f0844dd472bcc12644c",
          }
          token = os.environ["GH_TOKEN"]
          for run_id, expected_sha in checks.items():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{run_id}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req) as r:
                  data = json.load(r)
              assert data["head_sha"] == expected_sha, (run_id, data["head_sha"], expected_sha)
              assert data["status"] == "completed" and data["conclusion"] == "success", (run_id, data["status"], data["conclusion"])
          print("exact-final upstream workflows verified")
          PY

      - name: Parse persisted aggregate records
        run: |
          python -m json.tool integration/animo-reg/RG05I_B3_ADMISSION_INVENTORY.json >/dev/null
          python -m json.tool integration/animo-reg/RG05I_B3_QUEUE_DELTA.json >/dev/null
          python -m json.tool integration/animo-reg/ANIMO-RG05I_STATUS.json >/dev/null
          python -m py_compile tools/validate_rg05i_third_batch.py

      - name: Validate exact third batched admission integration and scope
        run: python tools/validate_rg05i_third_batch.py
