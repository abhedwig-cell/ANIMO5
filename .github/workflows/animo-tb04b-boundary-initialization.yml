name: ANIMO-TB04B boundary and initialization fragment qualification

on:
  push:
    branches:
      - work/animo-tb04b-boundary-initialization-bank-adoption
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded fragment
        run: python tools/validate_animo_tb04b.py
      - name: Guard hard boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE=ad9683716e1a41a6f6b3d32ff1012bfa215c27db
          git diff --name-only "$BASE"...HEAD > /tmp/tb04b_changed.txt
          if grep -Eq '^(src/|source/|Source/|animo/|ANIMO/)' /tmp/tb04b_changed.txt; then
            echo 'Production source path changed' >&2
            cat /tmp/tb04b_changed.txt >&2
            exit 1
          fi
          if grep -Fxq 'integration/animo-testbank/ANIMO_TESTBANK_REGISTRY.json' /tmp/tb04b_changed.txt; then
            echo 'Central testbank registry changed' >&2
            exit 1
          fi
          allowed='^(.github/workflows/animo-tb04b-boundary-initialization.yml|tools/validate_animo_tb04b.py|docs/testbank/ANIMO-TB04B_BOUNDARY_INITIALIZATION_ADOPTION.md|integration/animo-testbank/ANIMO-TB04B_STATUS.json|integration/animo-testbank/fragments/ANIMO-TB04B_BOUNDARY_INITIALIZATION_FRAGMENT.json|integration/animo-testbank/receipts/ANIMO-TB04B_QUALIFICATION_RECEIPT.json)$'
          bad=$(grep -Ev "$allowed" /tmp/tb04b_changed.txt || true)
          if [ -n "$bad" ]; then
            echo 'Out-of-scope files changed:' >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: Exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
