name: ANIMO-RG05M seventh batched B3 admission integration
on:
  push:
    branches: [work/animo-rg05m-seventh-batched-admission-integration]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch exact authorities
        run: |
          set -euo pipefail
          for sha in 214062fe773618ea77c7c74867cc8d9a2a4eef6d 22e4ec3bb88e2e13905ccbbb2f380a9bf235db55 9ca23f41dc3c28af686b1bc0bff8e7d66416d367 b74ec4461ab4d7b62ecfaf175e1eeeec8c58f7b2 942f26fe32eaf91679e59a1968ae173a3703e22d f65a47724e4a4fca7f2d8b8d6de9eeee51867904 1bbe4c211197590f346803106e45dca5faae79fc cbd262bdabe92923113b7326f2f42822ce9a971c; do git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"; done
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify consumed exact-final workflows
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          checks={34588681709:"214062fe773618ea77c7c74867cc8d9a2a4eef6d",34594813244:"22e4ec3bb88e2e13905ccbbb2f380a9bf235db55",34596771535:"9ca23f41dc3c28af686b1bc0bff8e7d66416d367",34601299550:"b74ec4461ab4d7b62ecfaf175e1eeeec8c58f7b2"}
          for n,h in checks.items():
            q=urllib.request.Request(f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{n}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
            with urllib.request.urlopen(q) as f:d=json.load(f)
            assert d["head_sha"]==h and d["status"]=="completed" and d["conclusion"]=="success",(n,d.get("head_sha"),d.get("status"),d.get("conclusion"))
          print("exact-final upstream workflows verified")
          PY
      - name: Parse records
        run: |
          python -m json.tool integration/animo-reg/RG05M_B3_ADMISSION_INVENTORY.json >/dev/null
          python -m json.tool integration/animo-reg/RG05M_B3_QUEUE_DELTA.json >/dev/null
          python -m json.tool integration/animo-reg/ANIMO-RG05M_STATUS.json >/dev/null
          python -m py_compile tools/validate_rg05m_seventh_batch.py
      - run: python tools/validate_rg05m_seventh_batch.py
