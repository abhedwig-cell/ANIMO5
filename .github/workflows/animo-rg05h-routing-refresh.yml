name: ANIMO-RG05H routing refresh and TCD-038 admission integration

on:
  push:
    branches:
      - work/animo-rg05h-b3i07-routing-tcd038-admission-integration
  pull_request:
    paths:
      - 'docs/governance/ANIMO_RG05H_ROUTING_REFRESH_AND_TCD038_ADMISSION_REGIE.md'
      - 'integration/animo-reg/ANIMO-RG05H_STATUS.json'
      - 'integration/animo-reg/RG05H_B3_ADMISSION_INVENTORY.json'
      - 'integration/animo-reg/RG05H_ROUTING_AUTHORITY_REFRESH.json'
      - 'tools/validate_rg05h_routing_refresh.py'
      - '.github/workflows/animo-rg05h-routing-refresh.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full RG05H history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact external authorities
        run: |
          git fetch --no-tags origin work/animo-b3d20-tcd038-gov04-tier-c-admission
          git fetch --no-tags origin work/animo-b3i07-tcd037-ghg-balance-observer-routing
          git fetch --no-tags origin work/animo-gov04-risk-tiered-review-policy
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse aggregate JSON
        run: |
          python -m json.tool integration/animo-reg/ANIMO-RG05H_STATUS.json >/dev/null
          python -m json.tool integration/animo-reg/RG05H_B3_ADMISSION_INVENTORY.json >/dev/null
          python -m json.tool integration/animo-reg/RG05H_ROUTING_AUTHORITY_REFRESH.json >/dev/null
      - name: Compile validator
        run: python -m py_compile tools/validate_rg05h_routing_refresh.py
      - name: Validate authority pins, aggregate semantics and scope
        run: python tools/validate_rg05h_routing_refresh.py
