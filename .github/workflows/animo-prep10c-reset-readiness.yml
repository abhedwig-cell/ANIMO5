name: ANIMO-PREP10C reset readiness

on:
  push:
    branches:
      - work/animo-prep10c-stable-dom-reset-readiness
  pull_request:
    paths:
      - 'docs/prep10c/**'
      - 'integration/animo-prep/PREP10C_*.json'
      - '.github/workflows/animo-prep10c-reset-readiness.yml'

permissions:
  contents: read

jobs:
  readiness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PREP10C JSON
        run: |
          python -m json.tool integration/animo-prep/PREP10C_STABLE_DOM_RESET_CANDIDATE.json >/dev/null
          python -m json.tool integration/animo-prep/PREP10C_STATUS.json >/dev/null
      - name: Verify parent evidence and fail-closed non-admission
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          candidate = json.loads(Path('integration/animo-prep/PREP10C_STABLE_DOM_RESET_CANDIDATE.json').read_text())
          status = json.loads(Path('integration/animo-prep/PREP10C_STATUS.json').read_text())
          parent = json.loads(Path('integration/animo-prep/PREP10_STABLE_DOM_PLOUGH_ACCUMULATOR_AUDIT.json').read_text())

          assert candidate['frozen_identity']['source_archive_sha256'] == '183c20eb75b6e9f02d33b54aa96fd1537519966401b6b41b9b6b108d98445566'
          assert candidate['frozen_identity']['testbank_archive_sha256'] == '44e375510150ff4e9c4f94d81a3b0872aa1c964fefd3a10571c0c2a12b98bb84'
          assert candidate['frozen_identity']['addit_for_sha256'] == 'e3cf8f427e9a4b3743742039c89aae57864cb7268893e45797c7a17427dc8f5d'
          assert parent['current_gnu_diagnostic_causal_carryover_qualified'] is True
          assert parent['historical_intel_manifestation_qualified'] is False
          assert status['state_dimensions']['corrected_legacy_lineage_started'] is False
          assert status['state_dimensions']['corrected_legacy_admitted'] is False
          assert status['state_dimensions']['production_migration_admitted'] is False
          assert candidate['admissions']['corrected_legacy_admitted'] is False
          assert candidate['admissions']['production_migration_admitted'] is False
          PY
      - name: Ensure PREP10C does not publish corrected Fortran source
        run: |
          if find docs/prep10c integration/animo-prep -maxdepth 2 -type f \( -iname '*.for' -o -iname '*.f90' -o -iname '*.zip' \) | grep -q .; then
            echo 'Unexpected raw/corrected source or archive in PREP10C scope'
            exit 1
          fi
