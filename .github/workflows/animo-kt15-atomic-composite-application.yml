name: ANIMO KT15 atomic composite application
on:
  push:
    branches: [work/animo-kt15-atomic-composite-application-commit]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch pinned authorities
        run: |
          set -euo pipefail
          for sha in 8efdd151d89e1cff131d4b21e2acf559ca1828d6 c2bd0d17ac6921fcd9f22d6289a510cae454153d de6eef3122354e74405ff9c92286794714bdee82 46e9e7397be751f245069033bae655b4382b63bd 1bbe4c211197590f346803106e45dca5faae79fc; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "${sha}"
          done
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python -m json.tool integration/animo-kt15/ANIMO-KT15_STATUS.json >/dev/null
      - name: Validate atomic application authority
        run: python tools/validate_kt15_atomic_composite_application.py
      - name: Compile and run atomic application tests
        run: bash tests/kt15/run_kt15_tests.sh
