name: ANIMO KT06 explicit hydrology runtime binding

on:
  push:
    branches:
      - work/animo-kt06-explicit-hydrology-runtime-binding
    paths:
      - 'prototype/kt06/**'
      - 'tests/kt06/**'
      - 'docs/kt06/**'
      - 'reference/kt06/**'
      - 'integration/animo-kt06/**'
      - '.github/workflows/animo-kt06-explicit-runtime-binding.yml'
  workflow_dispatch:

jobs:
  runtime-binding-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Re-run frozen KT02 qualification tests
        run: bash tests/kt02/run_kt02_tests.sh
      - name: Re-run frozen KT03 adapter tests
        run: python3 tests/kt03/test_kt03_hydrology_adapter.py
      - name: Re-run frozen KT05 compiled adapter tests
        run: bash tests/kt05/run_kt05_tests.sh
      - name: Run KT06 runtime-binding tests
        run: bash tests/kt06/run_kt06_tests.sh
      - name: Validate KT06 checkpoint
        run: python3 -m json.tool integration/animo-kt06/ANIMO-KT06_CHECKPOINT.json >/dev/null
      - name: Validate derived interval metadata
        run: python3 -m json.tool reference/kt06/LWKM_FIRST_INTERVAL_METADATA.json >/dev/null
