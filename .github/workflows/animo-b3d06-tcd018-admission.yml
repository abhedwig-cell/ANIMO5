name: ANIMO-B3D06 TCD018 admission closeout

on:
  push:
    branches:
      - work/animo-b3d06-tcd018-admission-closeout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-b3d06:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate TCD-018 admission closeout
        run: python tools/validate_b3d06_tcd018_admission.py

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              "integration/animo-b3/TCD018_B3_ADMISSION_CLOSEOUT.json",
              "integration/animo-b3/ANIMO-B3D06_STATUS.json",
              "docs/b3/TCD018_B3_ADMISSION_CLOSEOUT.md",
              "tools/validate_b3d06_tcd018_admission.py",
              ".github/workflows/animo-b3d06-tcd018-admission.yml",
          }
          base = "2f06cc86225637f8dadfdd969fe48dcf851b9ee2"
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"], text=True
          ).splitlines())
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit("FAIL_SCOPE_GUARD unexpected files: " + ", ".join(sorted(unexpected)))
          if missing:
              raise SystemExit("FAIL_SCOPE_GUARD missing admission files: " + ", ".join(sorted(missing)))
          print("PASS_B3D06_ADMISSION_SCOPE_GUARD")
          PY
