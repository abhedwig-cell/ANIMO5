name: ANIMO B3I07 TCD-037 observer child routing

on:
  push:
    branches:
      - work/animo-b3i07-tcd037-ghg-balance-observer-routing
  pull_request:
    paths:
      - 'docs/b3/POST_RUNTIMEQ03_TCD037_GHG_BALANCE_OBSERVER_ROUTING.md'
      - 'integration/animo-b3/B3I07_RUNTIMEQ03_FINDING_CROSSWALK.csv'
      - 'integration/animo-b3/B3I07_TCD037_ATOMIZATION.json'
      - 'integration/animo-b3/ANIMO-B3I07_STATUS.json'
      - 'tools/b3i07/**'
      - '.github/workflows/animo-b3i07-tcd037-routing.yml'

jobs:
  validate-b3i07:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for scope guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact RUNTIMEQ03 evidence branch
        run: git fetch --no-tags origin work/animo-runtimeq03-tcd037-ghg-balance-accounting-semantics
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse routing JSON
        run: |
          python -m json.tool integration/animo-b3/B3I07_TCD037_ATOMIZATION.json >/dev/null
          python -m json.tool integration/animo-b3/ANIMO-B3I07_STATUS.json >/dev/null
      - name: Compile validator
        run: python -m py_compile tools/b3i07/validate_b3i07.py
      - name: Validate canonical child routing and scope
        run: python tools/b3i07/validate_b3i07.py
