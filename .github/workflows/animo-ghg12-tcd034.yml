name: ANIMO-GHG12 TCD034 validation dataset acquisition

on:
  push:
    branches:
      - work/animo-ghg12-tcd034-validation-dataset-acquisition

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Fetch pinned predecessor
        run: git cat-file -e "98782bfa332aae0073d0686ad0261571a991a057^{commit}" 2>/dev/null || git fetch --no-tags origin 98782bfa332aae0073d0686ad0261571a991a057
      - name: Verify exact GHG11 predecessor CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          run_id=34853158997
          expected='98782bfa332aae0073d0686ad0261571a991a057'
          req=urllib.request.Request(
              f'https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{run_id}',
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
          )
          with urllib.request.urlopen(req) as response: data=json.load(response)
          assert data['head_sha']==expected
          assert data['status']=='completed' and data['conclusion']=='success'
          PY
      - name: Scope guard
        run: |
          bad="$(git diff --name-only 98782bfa332aae0073d0686ad0261571a991a057..HEAD | grep -Ev '^(.github/workflows/animo-ghg12-tcd034.yml|docs/ghg/TCD034_VALIDATION_DATASET_ACQUISITION.md|integration/animo-ghg/GHG12_TCD034_VALIDATION_DATASET_CANDIDATES.csv|integration/animo-ghg/GHG12_TCD034_VALIDATION_DATASET_ASSESSMENT.json|integration/animo-ghg/ANIMO-GHG12_AUTHORING_FREEZE.json|integration/animo-ghg/ANIMO-GHG12_INTERNAL_ADVERSARIAL_REVIEW.json|integration/animo-ghg/ANIMO-GHG12_STATUS.json|tools/ghg12/.*)$' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Parse package
        run: |
          python -m json.tool integration/animo-ghg/GHG12_TCD034_VALIDATION_DATASET_ASSESSMENT.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG12_AUTHORING_FREEZE.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG12_STATUS.json >/dev/null
          if test -f integration/animo-ghg/ANIMO-GHG12_INTERNAL_ADVERSARIAL_REVIEW.json; then python -m json.tool integration/animo-ghg/ANIMO-GHG12_INTERNAL_ADVERSARIAL_REVIEW.json >/dev/null; fi
          python -m py_compile tools/ghg12/validate_ghg12_tcd034.py
      - name: Validate dataset acquisition readiness
        run: python tools/ghg12/validate_ghg12_tcd034.py
