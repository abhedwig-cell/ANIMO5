name: ANIMO STATEQ11 composite accepted continuation
on:
  push:
    branches: [work/animo-stateq11-composite-accepted-continuation]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch pinned authorities
        run: |
          set -euo pipefail
          for sha in 8efdd151d89e1cff131d4b21e2acf559ca1828d6 e9ee7fc9e69a62c58b6eacd6379220cc51c1bf07 f6e91fc1cb664d67caccc02e6ab21525a768d006 614391014438b2cc4445d2d6a8008c3f0f1c45d0 fb0c0c842aed9a90378aca613279e09a856ad09b 1bbe4c211197590f346803106e45dca5faae79fc; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "${sha}"
          done
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python -m json.tool integration/animo-state/STATEQ11_COMPOSITION_MANIFEST.json >/dev/null
      - run: python -m json.tool integration/animo-state/ANIMO-STATEQ11_STATUS.json >/dev/null
      - name: Validate composite continuation authority
        run: python tools/stateq11/validate_stateq11.py
      - name: Compile and run composite continuation tests
        run: bash tests/stateq11/run_stateq11_tests.sh
