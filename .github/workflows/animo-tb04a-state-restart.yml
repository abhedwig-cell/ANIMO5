name: ANIMO-TB04A state and restart fragment qualification

on:
  push:
    branches:
      - work/animo-tb04a-state-restart-bank-adoption
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded fragment
        run: python tools/validate_animo_tb04a.py
      - name: Guard hard boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE=54a565c2f7f2a29817ae027cc18bee1613ce568d
          git diff --name-only "$BASE"...HEAD > /tmp/tb04a_changed.txt
          if grep -Eq '^(src/|source/|Source/|animo/|ANIMO/)' /tmp/tb04a_changed.txt; then
            echo 'Production source path changed' >&2
            exit 1
          fi
          if grep -Fxq 'integration/animo-testbank/ANIMO_TESTBANK_REGISTRY.json' /tmp/tb04a_changed.txt; then
            echo 'Central testbank registry changed by fragment producer' >&2
            exit 1
          fi
      - name: Exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
