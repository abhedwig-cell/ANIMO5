name: ANIMO-B3B09 TCD-038 Tier-C readiness

on:
  push:
    branches:
      - work/animo-b3b09-tcd038-crop-actual-uptake-restart-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate TCD-038 readiness and risk route
        run: python tools/validate_b3b09_tcd038_readiness.py

      - name: Validate atomic readiness scope
        run: python tools/validate_b3b09_scope.py
