name: ANIMO-B3D31 TCD025-A4 P admission
on:
  push:
    branches: [work/animo-b3d31-tcd025-a4-phosphorus-gov05-tier-c-admission]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch exact authorities
        run: |
          set -euo pipefail
          for sha in f4a3056087e5f7bac41b243be1f404739cde52b0 872c78b6c020086280e31e1d9a7408e8b5a1afc7 68a8c202bd01bf55b31b7c944884fb2f78a6a8e8 e5ccad78d7c85aaf2c68d844c5a496edf6d73db5 ce602528d075fc962b0b78759ed0082d1ec78a51 97fd3274acd47bac74939d9dbd55b908043d1521 5da4e4f38ca94630ff857deb66e86f974425f30c f65a47724e4a4fca7f2d8b8d6de9eeee51867904 1bbe4c211197590f346803106e45dca5faae79fc cbd262bdabe92923113b7326f2f42822ce9a971c 846e0f4d02a38b9e02cc1419b1ca87e63aaedb54; do git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"; done
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify exact-final authorities
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          checks={34572242797:"f4a3056087e5f7bac41b243be1f404739cde52b0",34571906586:"872c78b6c020086280e31e1d9a7408e8b5a1afc7",34570642773:"68a8c202bd01bf55b31b7c944884fb2f78a6a8e8",34582143283:"e5ccad78d7c85aaf2c68d844c5a496edf6d73db5",34572641664:"ce602528d075fc962b0b78759ed0082d1ec78a51",34572919222:"97fd3274acd47bac74939d9dbd55b908043d1521",34573179762:"5da4e4f38ca94630ff857deb66e86f974425f30c",34546470484:"f65a47724e4a4fca7f2d8b8d6de9eeee51867904"}
          for n,h in checks.items():
            q=urllib.request.Request(f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{n}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
            with urllib.request.urlopen(q) as f:d=json.load(f)
            assert d["head_sha"]==h and d["status"]=="completed" and d["conclusion"]=="success",(n,d.get("head_sha"),d.get("status"),d.get("conclusion"))
          print("exact-final authorities verified")
          PY
      - run: python -m py_compile tools/validate_b3d31_tcd025_a4.py
      - run: python tools/validate_b3d31_tcd025_a4.py
