name: ANIMO-B3D18 TCD-028 Tier-C admission

on:
  push:
    branches:
      - work/animo-b3d18-tcd028-gov04-tier-c-admission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate TCD-028 Tier-C B3 admission
        run: python tools/validate_b3d18_tcd028_admission.py
      - name: Validate admission-only scope
        run: python tools/guard_b3d18_tcd028_scope.py
