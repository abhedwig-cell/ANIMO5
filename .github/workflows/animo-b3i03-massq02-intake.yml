name: ANIMO-B3I03 post-MASSQ02 intake validation

on:
  push:
    branches:
      - work/animo-b3i03-massq02-causal-intake
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate B3I03 governance artifacts
        run: python tools/b3i03/validate_b3i03.py
