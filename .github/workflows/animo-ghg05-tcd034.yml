name: ANIMO-GHG05 TCD034 plant-growth temperature selector requalification

on:
  push:
    branches:
      - work/animo-ghg05-tcd034-plant-growth-temperature-selector-requalification

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Fetch exact authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in 11e9bcdc6654e63f84875bf1f28dc54abe725700 bc9e6ed997a078336645210ebb4d99ae976893fe f65a47724e4a4fca7f2d8b8d6de9eeee51867904 dac7b7b5c591b781b82ec968896edb5957664c88 846e0f4d02a38b9e02cc1419b1ca87e63aaedb54; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
      - name: Verify current negative B3 closure authority CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          run_id = 34687903443
          expected = "11e9bcdc6654e63f84875bf1f28dc54abe725700"
          req = urllib.request.Request(
              f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{run_id}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response:
              data = json.load(response)
          assert data["head_sha"] == expected, data.get("head_sha")
          assert data["status"] == "completed" and data["conclusion"] == "success", (data.get("status"), data.get("conclusion"))
          print("B3Q06 exact-final CI authority verified")
          PY
      - name: Parse package
        run: |
          python -m json.tool integration/animo-ghg/GHG05_TCD034_SOURCE_RECONSTRUCTION.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG05_AUTHORING_FREEZE.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG05_STATUS.json >/dev/null
          if test -f integration/animo-ghg/ANIMO-GHG05_INTERNAL_ADVERSARIAL_REVIEW.json; then
            python -m json.tool integration/animo-ghg/ANIMO-GHG05_INTERNAL_ADVERSARIAL_REVIEW.json >/dev/null
          fi
          python -m py_compile tools/ghg05/validate_ghg05_tcd034.py
      - name: Compile and run current-GNU post-DO mechanistic controls
        run: |
          gfortran --version
          gfortran -std=f2018 -Wall -Wextra -fcheck=all -O0 tools/ghg05/tcd034_post_do_probe.f90 -o /tmp/tcd034_post_do_probe
          /tmp/tcd034_post_do_probe | tee /tmp/tcd034_post_do_probe.out
          grep -Fx 'positive_trip_post_do_ln=4' /tmp/tcd034_post_do_probe.out
          grep -Fx 'zero_trip_post_do_ln=1' /tmp/tcd034_post_do_probe.out
          grep -Fx 'explicit_reset_negative_control_ln=3' /tmp/tcd034_post_do_probe.out
      - name: Validate bounded TCD034 requalification
        run: python tools/ghg05/validate_ghg05_tcd034.py
