name: ANIMO-B3Q01 governance validation

on:
  push:
    branches:
      - work/animo-b3q01-scientific-admission-framework
  pull_request:
    paths:
      - 'docs/governance/B3_*.md'
      - 'integration/animo-b3/**'
      - 'tools/validate_b3q01_governance.py'
      - '.github/workflows/animo-b3q01-governance.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse disposition schema JSON
        run: python -m json.tool integration/animo-b3/B3_DISPOSITION_SCHEMA.json >/dev/null
      - name: Parse status JSON
        run: python -m json.tool integration/animo-b3/ANIMO-B3Q01_STATUS.json >/dev/null
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Check JSON Schema validity
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open('integration/animo-b3/B3_DISPOSITION_SCHEMA.json', encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          print('JSON Schema: PASS')
          PY
      - name: Validate normal-route fixture
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          import tools.validate_b3q01_governance as v
          schema = json.load(open('integration/animo-b3/B3_DISPOSITION_SCHEMA.json', encoding='utf-8'))
          Draft202012Validator(schema).validate(v.normal_class_a_record())
          print('Normal route fixture: PASS')
          PY
      - name: Validate historical-uncertainty fixture
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          import tools.validate_b3q01_governance as v
          schema = json.load(open('integration/animo-b3/B3_DISPOSITION_SCHEMA.json', encoding='utf-8'))
          Draft202012Validator(schema).validate(v.uncertainty_class_a_record())
          print('Historical uncertainty fixture: PASS')
          PY
      - name: Validate full fail-closed governance contract
        run: python tools/validate_b3q01_governance.py
