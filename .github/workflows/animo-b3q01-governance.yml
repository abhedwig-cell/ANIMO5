name: ANIMO-B3Q01 governance validation

on:
  push:
    branches:
      - work/animo-b3q01-scientific-admission-framework
  pull_request:
    paths:
      - 'docs/governance/B3_*.md'
      - 'integration/animo-b3/**'
      - 'tools/validate_b3q01_governance.py'
      - '.github/workflows/animo-b3q01-governance.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate B3 governance artifacts
        run: python tools/validate_b3q01_governance.py
