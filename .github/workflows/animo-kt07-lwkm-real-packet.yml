name: ANIMO KT07 LWKM real packet fixture

on:
  push:
    branches:
      - work/animo-kt07-lwkm-real-packet-fixture
    paths:
      - 'reference/kt07/**'
      - 'tools/kt07_*'
      - 'tests/kt07/**'
      - 'docs/kt07/**'
      - 'integration/animo-kt07/**'
      - '.github/workflows/animo-kt07-lwkm-real-packet.yml'
  workflow_dispatch:

jobs:
  real-packet-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Re-run frozen KT03 adapter tests
        run: python3 tests/kt03/test_kt03_hydrology_adapter.py
      - name: Re-run frozen KT05 compiled adapter tests
        run: bash tests/kt05/run_kt05_tests.sh
      - name: Run KT07 real-packet tests
        run: bash tests/kt07/run_kt07_tests.sh
      - name: Validate KT07 checkpoint
        run: python3 -m json.tool integration/animo-kt07/ANIMO-KT07_CHECKPOINT.json >/dev/null
      - name: Validate KT07 derived fixture
        run: python3 -m json.tool reference/kt07/LWKM_FIRST_EXPLICIT_HYDROLOGY_STEP.json >/dev/null
