name: ANIMO-B3D24 TCD-037-A2 Tier-A atomic admission

on:
  push:
    branches:
      - work/animo-b3d24-tcd037-a2-gov05-tier-a-admission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact admission authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            466718167b22a643b26ee5035a18514987b6e289 \
            3e4247928bb43f30def951fa8804560636affbef \
            54679c7555a963133dfd686648af334f479c5808 \
            a3e822f8e97fe1312a7dfa73601a49ae7375163e \
            0ca6b31dc8d003ab2b86ced29a2ff8923496ee38 \
            f65a47724e4a4fca7f2d8b8d6de9eeee51867904 \
            1bbe4c211197590f346803106e45dca5faae79fc \
            cbd262bdabe92923113b7326f2f42822ce9a971c \
            846e0f4d02a38b9e02cc1419b1ca87e63aaedb54 \
            1db63b17cb5f48cbd8ae28116a2e716b4bdaadf3
          do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "${sha}"
            git cat-file -e "${sha}^{commit}"
          done

      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Parse admission records and compile validator
        run: |
          python -m json.tool integration/animo-b3/TCD037_A2_TIER_A_WAIVER_AUDIT.json >/dev/null
          python -m json.tool integration/animo-b3/TCD037_A2_CHILD_ATOM_FORMAL_DISPOSITION.json >/dev/null
          python -m json.tool integration/animo-b3/ANIMO-B3D24_STATUS.json >/dev/null
          python -m py_compile tools/validate_b3d24_tcd037_a2.py

      - name: Validate Tier-A waiver, B3Q01 disposition, B3Q02 carrier and scope
        run: python tools/validate_b3d24_tcd037_a2.py
