name: ANIMO SQ09 TCD016 C1 Explicit Model Evolution

on:
  push:
    branches:
      - work/animo-sq09-tcd016-c1-explicit-model-evolution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 1f13c7cab30772f4aa8d5071b19d13761c2b5f16^{commit}

      - name: Validate SQ09 scientific package
        run: python tools/sq09/validate_sq09_tcd016_c1.py

      - name: Run bounded model-evolution contract oracle
        run: python tools/sq09/tcd016_c1_model_evolution_oracle.py

      - name: Enforce governance-only scientific change surface
        shell: bash
        run: |
          set -euo pipefail
          base=1f13c7cab30772f4aa8d5071b19d13761c2b5f16
          if git diff --name-only "$base"..HEAD | grep -E '^(src/|integration/animo-reg/)' ; then
            echo 'Forbidden production/regie mutation in SQ09'
            exit 1
          fi
          if git diff --name-only "$base"..HEAD | grep -E '(^|/)(TCD.*REGISTER|RG05_B3_QUEUE|CENTRAL_TESTBANK)' ; then
            echo 'Forbidden shared registry/queue/testbank authority mutation in SQ09'
            exit 1
          fi

      - name: Record exact head
        shell: bash
        run: |
          set -euo pipefail
          echo "validated_head=$(git rev-parse HEAD)"
          echo "validated_tree=$(git rev-parse HEAD^{tree})"
