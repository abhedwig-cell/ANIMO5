name: ANIMO-SQ03 TCD016-C1 process-envelope qualification

on:
  push:
    branches:
      - work/animo-sq03-tcd016-c1-process-envelope

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Fetch exact authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in 09ab76f0b44cb72956875fa379d68bbf97f1a0c7 11e9bcdc6654e63f84875bf1f28dc54abe725700 bc9e6ed997a078336645210ebb4d99ae976893fe f65a47724e4a4fca7f2d8b8d6de9eeee51867904 26d0c74aa440bd73c23709d313e24ea8af2a0bcd; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
      - name: Verify current negative B3 closure authority CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          run_id = 34687903443
          expected = "11e9bcdc6654e63f84875bf1f28dc54abe725700"
          req = urllib.request.Request(
              f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{run_id}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response:
              data = json.load(response)
          assert data["head_sha"] == expected
          assert data["status"] == "completed" and data["conclusion"] == "success"
          print("B3Q06 exact-final CI authority verified")
          PY
      - name: Parse and compile SQ03 package
        run: |
          python -m json.tool integration/animo-science/SQ03_TCD016_C1_PROCESS_ENVELOPE.json >/dev/null
          python -m json.tool integration/animo-science/ANIMO-SQ03_AUTHORING_FREEZE.json >/dev/null
          python -m json.tool integration/animo-science/ANIMO-SQ03_STATUS.json >/dev/null
          if test -f integration/animo-science/ANIMO-SQ03_INTERNAL_ADVERSARIAL_REVIEW.json; then
            python -m json.tool integration/animo-science/ANIMO-SQ03_INTERNAL_ADVERSARIAL_REVIEW.json >/dev/null
          fi
          python -m py_compile tools/sq03/tcd016_c1_process_envelope_oracle.py
          python -m py_compile tools/sq03/validate_sq03_tcd016_c1.py
      - name: Run exact process-envelope oracle
        run: |
          python tools/sq03/tcd016_c1_process_envelope_oracle.py | tee /tmp/sq03_oracle.out
          grep -Fx 'TCD016-C1 SQ03 process-envelope oracle PASS' /tmp/sq03_oracle.out
          grep -Fx 'dry_hold_365_steps_exact PASS' /tmp/sq03_oracle.out
          grep -Fx 'bounded_transfer_partitions_exact PASS' /tmp/sq03_oracle.out
          grep -Fx 'receiver_neutral_partition_exact PASS' /tmp/sq03_oracle.out
          grep -Fx 'out_of_range_negative_controls PASS' /tmp/sq03_oracle.out
          grep -Fx 'receiver_partition_negative_controls PASS' /tmp/sq03_oracle.out
          grep -Fx 'model_tolerance NONE' /tmp/sq03_oracle.out
          grep -Fx 'specific_process_law_qualified false' /tmp/sq03_oracle.out
          grep -Fx 'specific_receiver_qualified false' /tmp/sq03_oracle.out
          grep -Fx 'historical_behavior UNKNOWN_WITHOUT_B2' /tmp/sq03_oracle.out
      - name: Validate bounded TCD016-C1 process envelope
        run: python tools/sq03/validate_sq03_tcd016_c1.py
