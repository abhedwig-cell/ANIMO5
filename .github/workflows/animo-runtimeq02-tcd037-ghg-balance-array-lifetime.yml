name: ANIMO-RUNTIMEQ02 TCD-037 GHG balance ownership qualification

on:
  push:
    branches:
      - work/animo-runtimeq02-tcd037-ghg-balance-array-lifetime
  pull_request:
    paths:
      - 'docs/runtime/ANIMO-RUNTIMEQ02_WORK_UNIT_CONTRACT.md'
      - 'docs/runtime/TCD037_GHG_BALANCE_WORKING_ARRAY_OWNERSHIP_QUALIFICATION.md'
      - 'integration/animo-runtime/ANIMO-RUNTIMEQ02_STATUS.json'
      - 'integration/animo-runtime/TCD037_GHG_BALANCE_OWNERSHIP_MATRIX.json'
      - 'tools/runtimeq02/**'
      - 'tools/validate_runtimeq02.py'
      - '.github/workflows/animo-runtimeq02-tcd037-ghg-balance-array-lifetime.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version

      - name: Validate persisted qualification and scope
        run: |
          python -m py_compile tools/validate_runtimeq02.py
          python -m json.tool integration/animo-runtime/TCD037_GHG_BALANCE_OWNERSHIP_MATRIX.json >/dev/null
          python -m json.tool integration/animo-runtime/ANIMO-RUNTIMEQ02_STATUS.json >/dev/null
          python tools/validate_runtimeq02.py

      - name: Reproduce active, inactive and repeated-call lifetime discriminator at O0
        run: |
          gfortran -O0 -fautomatic -finit-real=snan -ffpe-summary=none \
            -fdefault-real-8 -fdefault-double-8 \
            tools/runtimeq02/runtimeq02_observer_lifetime_probe.f90 \
            -o runtimeq02_O0.exe
          ./runtimeq02_O0.exe > runtimeq02_O0.out
          test "$(wc -l < runtimeq02_O0.out)" -eq 6
          grep -qx 'INACTIVE_OK T' runtimeq02_O0.out
          grep -qx 'FIRST_READ_EXPOSED T' runtimeq02_O0.out
          grep -qx 'AUTOMATIC_REPEAT_NOT_PERSISTENT T' runtimeq02_O0.out
          grep -qx 'PERSISTENCE_STALE_REUSE T' runtimeq02_O0.out
          grep -qx 'NITR_STEP_REFRESH T' runtimeq02_O0.out
          grep -qx 'PHYSICAL_UNCHANGED T' runtimeq02_O0.out

      - name: Reproduce discriminator at O2 and require identical evidence
        run: |
          gfortran -O2 -fautomatic -finit-real=snan -ffpe-summary=none \
            -fdefault-real-8 -fdefault-double-8 \
            tools/runtimeq02/runtimeq02_observer_lifetime_probe.f90 \
            -o runtimeq02_O2.exe
          ./runtimeq02_O2.exe > runtimeq02_O2.out
          cmp runtimeq02_O0.out runtimeq02_O2.out
