name: ANIMO-GHG08 TCD034 parent closure readiness

on:
  push:
    branches:
      - work/animo-ghg08-tcd034-parent-scientific-closure-readiness

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Fetch pinned authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in f8969334f648ca28ceb93a2a55bb4eedd478e1dc 2573686af69a8d68a94010bb663272b35871a6e1 730f09f1567461a45bff4566368db05963b200fa cf235fbc93fdb77d93aa260c8ede8fcdbbdbc5d3 846e0f4d02a38b9e02cc1419b1ca87e63aaedb54 11e9bcdc6654e63f84875bf1f28dc54abe725700 cbd262bdabe92923113b7326f2f42822ce9a971c 1bbe4c211197590f346803106e45dca5faae79fc f65a47724e4a4fca7f2d8b8d6de9eeee51867904 7a7d3a1f5a5c07bf36b7e6e2915338dabde20660 bc9e6ed997a078336645210ebb4d99ae976893fe 942f26fe32eaf91679e59a1968ae173a3703e22d; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
      - name: Verify exact GHG07 predecessor CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          run_id = 34844249959
          expected = "f8969334f648ca28ceb93a2a55bb4eedd478e1dc"
          req = urllib.request.Request(
              f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{run_id}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response:
              data = json.load(response)
          assert data["head_sha"] == expected, data.get("head_sha")
          assert data["status"] == "completed" and data["conclusion"] == "success", (data.get("status"), data.get("conclusion"))
          print("GHG07 exact-final CI authority verified")
          PY
      - name: Parse package
        run: |
          python -m json.tool integration/animo-ghg/GHG08_TCD034_PARENT_CLOSURE_DECISION.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG08_AUTHORING_FREEZE.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG08_STATUS.json >/dev/null
          if test -f integration/animo-ghg/ANIMO-GHG08_INTERNAL_ADVERSARIAL_REVIEW.json; then
            python -m json.tool integration/animo-ghg/ANIMO-GHG08_INTERNAL_ADVERSARIAL_REVIEW.json >/dev/null
          fi
          python -m py_compile tools/ghg08/validate_ghg08_tcd034.py
      - name: Validate TCD034 parent closure/readiness synthesis
        run: python tools/ghg08/validate_ghg08_tcd034.py
