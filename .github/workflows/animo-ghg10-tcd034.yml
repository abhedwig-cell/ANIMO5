name: ANIMO-GHG10 TCD034 frozen-driver selector replay

on:
  push:
    branches:
      - work/animo-ghg10-tcd034-frozen-driver-selector-replay

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Fetch pinned predecessor
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "31c8ba9a53cb602c7a4a71f501384058ef7be7b2^{commit}" 2>/dev/null || git fetch --no-tags origin 31c8ba9a53cb602c7a4a71f501384058ef7be7b2
      - name: Verify exact GHG09 predecessor CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          run_id=34846130237
          expected="31c8ba9a53cb602c7a4a71f501384058ef7be7b2"
          req=urllib.request.Request(
              f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{run_id}",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response: data=json.load(response)
          assert data["head_sha"]==expected
          assert data["status"]=="completed" and data["conclusion"]=="success"
          print("GHG09 exact-final CI authority verified")
          PY
      - name: Parse package
        run: |
          python -m json.tool integration/animo-ghg/GHG10_TCD034_FROZEN_DRIVER_REPLAY_SUMMARY.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG10_AUTHORING_FREEZE.json >/dev/null
          python -m json.tool integration/animo-ghg/ANIMO-GHG10_STATUS.json >/dev/null
          if test -f integration/animo-ghg/ANIMO-GHG10_INTERNAL_ADVERSARIAL_REVIEW.json; then python -m json.tool integration/animo-ghg/ANIMO-GHG10_INTERNAL_ADVERSARIAL_REVIEW.json >/dev/null; fi
          python -m py_compile tools/ghg10/validate_ghg10_tcd034.py
      - name: Validate frozen-driver selector replay
        run: python tools/ghg10/validate_ghg10_tcd034.py
