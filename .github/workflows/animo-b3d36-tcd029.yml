name: ANIMO-B3D36 TCD029 Tier-C admission

on:
  push:
    branches:
      - work/animo-b3d36-tcd029-gov05-tier-c-admission
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-b3d36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate TCD029 admission package and scope
        run: python tools/validate_b3d36_tcd029.py
