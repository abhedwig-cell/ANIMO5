name: ANIMO-B3A01 TCD-027 readiness validation

on:
  push:
    branches:
      - work/animo-b3a01-tcd027-class-a-readiness
  pull_request:
    paths:
      - 'docs/b3a01/**'
      - 'integration/animo-b3/TCD027_CLASS_A_READINESS.json'
      - 'integration/animo-b3/ANIMO-B3A01_STATUS.json'
      - 'tools/validate_b3a01_tcd027.py'
      - '.github/workflows/animo-b3a01-tcd027.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse readiness and status JSON
        run: |
          python -m json.tool integration/animo-b3/TCD027_CLASS_A_READINESS.json >/dev/null
          python -m json.tool integration/animo-b3/ANIMO-B3A01_STATUS.json >/dev/null
      - name: Validate TCD-027 readiness contract
        run: python tools/validate_b3a01_tcd027.py
