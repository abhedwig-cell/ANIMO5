name: ANIMO-B3A07 TCD-037-A3 Tier-A readiness

on:
  push:
    branches:
      - work/animo-b3a07-tcd037-a3-tier-a-readiness
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact evidence and governance authorities
        shell: bash
        run: |
          set -euo pipefail
          for sha in \
            94afe7d649a8c60758a41996f0059de0acddd2fc \
            31d4ac628edf43501b403f0844dd472bcc12644c \
            54679c7555a963133dfd686648af334f479c5808 \
            a3e822f8e97fe1312a7dfa73601a49ae7375163e \
            842f72300fd03ede0b9024537a7ee6126722a121 \
            f65a47724e4a4fca7f2d8b8d6de9eeee51867904 \
            1bbe4c211197590f346803106e45dca5faae79fc \
            cbd262bdabe92923113b7326f2f42822ce9a971c \
            846e0f4d02a38b9e02cc1419b1ca87e63aaedb54
          do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "${sha}"
            git cat-file -e "${sha}^{commit}"
          done

      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify exact-final aggregate evidence and governance workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          checks = {
              34549097225: "94afe7d649a8c60758a41996f0059de0acddd2fc",
              34548605202: "31d4ac628edf43501b403f0844dd472bcc12644c",
              34546470484: "f65a47724e4a4fca7f2d8b8d6de9eeee51867904",
          }
          token=os.environ["GH_TOKEN"]
          for run_id,sha in checks.items():
              req=urllib.request.Request(
                  f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{run_id}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"},
              )
              with urllib.request.urlopen(req) as r: data=json.load(r)
              assert data["head_sha"]==sha,(run_id,data["head_sha"],sha)
              assert data["status"]=="completed" and data["conclusion"]=="success",(run_id,data["status"],data["conclusion"])
          print("exact-final upstream workflows verified")
          PY

      - name: Parse readiness records
        run: |
          python -m json.tool integration/animo-b3/TCD037_A3_TIER_A_READINESS.json >/dev/null
          python -m json.tool integration/animo-b3/ANIMO-B3A07_STATUS.json >/dev/null
          python -m py_compile tools/validate_b3a07_tcd037_a3.py

      - name: Validate authorities retained Tier-A predicate and scope
        run: python tools/validate_b3a07_tcd037_a3.py
