name: ANIMO-B3B03R independent review execution contract

on:
  push:
    branches:
      - work/animo-b3b03r-review-execution-contract
      - review/animo-b3b03r-tcd024-independent-second-line
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse independent review result JSON
        run: python -m json.tool integration/animo-b3/TCD024_INDEPENDENT_REVIEW_RESULT.json >/dev/null

      - name: Validate fail-closed independent review contract
        run: python tools/validate_b3b03r_independent_review.py

      - name: Guard independent-review scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 11db97289ffafdd6281b83f0aa0e96b544d6eb5a..HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          while IFS= read -r f; do
            case "$f" in
              docs/b3/TCD024_INDEPENDENT_SECOND_LINE_REVIEW.md|integration/animo-b3/TCD024_INDEPENDENT_REVIEW_RESULT.json|tools/validate_b3b03r_independent_review.py|.github/workflows/animo-b3b03r-independent-review-contract.yml)
                ;;
              *)
                echo "Unexpected file outside B3B03R independent-review scope: $f" >&2
                exit 1
                ;;
            esac
          done < /tmp/changed.txt
