name: ANIMO-RG05C third B3 admission integration

on:
  push:
    branches:
      - work/animo-rg05c-third-b3-admission-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rg05c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate third B3 admission integration
        run: python tools/validate_rg05c_third_b3_admission.py

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              "docs/governance/ANIMO_RG05C_THIRD_B3_ADMISSION_REGIE.md",
              "integration/animo-reg/RG05C_B3_ADMISSION_INVENTORY.json",
              "integration/animo-reg/RG05C_B3_QUEUE_DELTA.json",
              "integration/animo-reg/ANIMO-RG05C_STATUS.json",
              "tools/validate_rg05c_third_b3_admission.py",
              ".github/workflows/animo-rg05c-third-b3-admission.yml",
          }
          base = "11286faafcc59717196ed045d96c9d215c74abeb"
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"], text=True
          ).splitlines())
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit("FAIL_SCOPE_GUARD unexpected files: " + ", ".join(sorted(unexpected)))
          if missing:
              raise SystemExit("FAIL_SCOPE_GUARD missing RG05C files: " + ", ".join(sorted(missing)))
          print("PASS_RG05C_SCOPE_GUARD")
          PY
