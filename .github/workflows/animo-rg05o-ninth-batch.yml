name: ANIMO-RG05O ninth batched B3 admission integration
on:
  push:
    branches: [work/animo-rg05o-ninth-batched-admission-integration]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch exact authorities
        run: |
          set -euo pipefail
          for sha in 8758bd30e302b75dd7854ac00fd2e29473669a13 83fedc7323cea6da696a81bc64e4e3b13d794880 3ac98899dd4e6b7a5133cbecd758fab0b81e945d 86474df11ecf104797df9df3b8d53fcf2e847873 942f26fe32eaf91679e59a1968ae173a3703e22d 997d867a2b107ec8e28efce530c82a204719de46 f65a47724e4a4fca7f2d8b8d6de9eeee51867904 1bbe4c211197590f346803106e45dca5faae79fc cbd262bdabe92923113b7326f2f42822ce9a971c; do git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"; done
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify consumed exact-final workflows
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          checks={34646787915:"8758bd30e302b75dd7854ac00fd2e29473669a13",34655310361:"83fedc7323cea6da696a81bc64e4e3b13d794880",34676576732:"3ac98899dd4e6b7a5133cbecd758fab0b81e945d",34687484143:"86474df11ecf104797df9df3b8d53fcf2e847873"}
          for n,h in checks.items():
            q=urllib.request.Request(f"https://api.github.com/repos/abhedwig-cell/ANIMO5/actions/runs/{n}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
            with urllib.request.urlopen(q) as f:d=json.load(f)
            assert d["head_sha"]==h and d["status"]=="completed" and d["conclusion"]=="success",(n,d.get("head_sha"),d.get("status"),d.get("conclusion"))
          print("exact-final upstream workflows verified")
          PY
      - name: Parse records
        run: |
          python -m json.tool integration/animo-reg/RG05O_B3_ADMISSION_INVENTORY.json >/dev/null
          python -m json.tool integration/animo-reg/RG05O_B3_QUEUE_DELTA.json >/dev/null
          python -m json.tool integration/animo-reg/ANIMO-RG05O_STATUS.json >/dev/null
          python -m py_compile tools/validate_rg05o_ninth_batch.py
      - run: python tools/validate_rg05o_ninth_batch.py
