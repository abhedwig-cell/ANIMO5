name: ANIMO B3 TCD-028 intake

on:
  push:
    branches:
      - work/animo-b3-tcd028-stable-dom-intake
  pull_request:
    paths:
      - 'docs/b3/TCD-028_STABLE_DOM_PLOUGH_ACCUMULATOR_INTAKE.md'
      - 'integration/animo-b3/TCD-028_RESERVATION.json'
      - 'tools/validate_tcd028_intake.py'
      - '.github/workflows/animo-b3-tcd028-intake.yml'

permissions:
  contents: read

jobs:
  validate-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile intake validator
        run: python -m py_compile tools/validate_tcd028_intake.py
      - name: Parse reservation JSON
        run: python -m json.tool integration/animo-b3/TCD-028_RESERVATION.json >/dev/null
      - name: Validate fail-closed TCD-028 reservation
        run: python tools/validate_tcd028_intake.py
