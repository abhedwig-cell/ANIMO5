name: ANIMO-B3D39 TCD036 atomic admission

on:
  push:
    branches:
      - work/animo-b3d39-tcd036-gov05-tier-c-admission

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run inherited bounded layer0 oracle
        run: python tools/stateq07/tcd036_ponding_layer0_oracle.py
      - name: Validate B3D39 admission contract and scope
        run: python tools/validate_b3d39_tcd036.py
